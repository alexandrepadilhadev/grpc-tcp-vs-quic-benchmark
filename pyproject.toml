[project]
name = "grpc-tcp-vs-quic-benchmark"
version = "0.1.0"
description = "Benchmark of gRPC over HTTP/2 (TCP) vs HTTP/3 (QUIC) in a microservices environment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Padilha" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "aioquic>=1.2",
    "h2>=4.1",
    "protobuf>=5.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "pyyaml>=6.0",
    "pyarrow>=18.0",
    "docker>=7.1",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grpcq", "src/bench", "src/services"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/gen"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "A",     # builtins shadowing
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return statements
    "BLE",   # blind except
    "TRY",   # exception handling
    "S",     # bandit (security)
    "ASYNC", # async pitfalls
    "PT",    # pytest style
    "RUF",   # ruff-specific
]
ignore = [
    "TRY003", # long messages in exception constructors are fine
    "S311",   # non-crypto random is intended for workloads
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
exclude = ["^src/gen/"]

[[tool.mypy.overrides]]
module = ["aioquic.*", "docker.*", "pyarrow.*", "scipy.*", "grpc.*", "grpc_tools.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "integration: end-to-end tests over real sockets",
    "interop: tests against the official grpcio implementation",
    "docker: tests that require a Docker engine",
]
